name: Create VPS
on: 
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Optional: Auto-run every 6 hours

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setting up VPS
        run: |
          sudo apt update
          sudo apt install tmate -y
          
      - name: Start tmate session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          
      - name: Keep Alive & Backup Trigger
        run: |
          # This keeps the session running for nearly 6 hours
          # At 5h 55m, it triggers the backup script
          sleep 21300 
          bash backup-restore.sh backup
