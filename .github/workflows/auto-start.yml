name: Auto Restart VPS
on:
  workflow_run:
    workflows: ["Create VPS"]
    types:
      - completed

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger New VPS
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/tmate.yml/dispatches \
          -d '{"ref":"main"}'
